name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: caselens
          POSTGRES_USER: caselens_owner
          POSTGRES_PASSWORD: ci_owner_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caselens_owner -d caselens"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      analytics-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: caselens_analytics
          POSTGRES_USER: caselens_analytics
          POSTGRES_PASSWORD: ci_analytics_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U caselens_analytics -d caselens_analytics"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PGPASSWORD: ci_owner_password
      APP_DATABASE_PASSWORD: ci_runtime_password
      TEST_DATABASE_URL: postgresql://caselens_app:ci_runtime_password@127.0.0.1:5432/caselens
      # Three of the five integration suites are gated on an owner connection and had been
      # skipping silently, so the RLS policies, the migration DDL and the pgvector queries were
      # never actually exercised by CI despite the job being named for them.
      TEST_ADMIN_DATABASE_URL: postgresql://caselens_owner:ci_owner_password@127.0.0.1:5432/caselens
      # A second server, not a second database on the first. The projection is meant to survive the
      # case pipeline's database being down, and a schema sharing the server cannot demonstrate that.
      TEST_ANALYTICS_DATABASE_URL: postgresql://caselens_analytics:ci_analytics_password@127.0.0.1:5433/caselens_analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Initialize production database schema
        shell: bash
        run: |
          for script in infra/postgres/init/*.sql; do
            psql --host=127.0.0.1 --username=caselens_owner --dbname=caselens --set=ON_ERROR_STOP=1 --file="$script"
          done
          psql --host=127.0.0.1 --username=caselens_owner --dbname=caselens --set=ON_ERROR_STOP=1 --set=runtime_password="$APP_DATABASE_PASSWORD" --file=infra/postgres/provision/001_runtime_login.sql
          # The init scripts provision a fresh database; the numbered migrations carry every schema
          # change made since. The production-local compose applies both in this order, and so must
          # CI — running init alone leaves out tables the integration tests exercise.
          # Deliberately `0*.sql`, matching that compose service: 9999_post_drizzle.sql belongs to
          # the Drizzle-generated path, which infra/postgres/init replaces for container profiles.
          for migration in packages/persistence/migrations/0*.sql; do
            psql --host=127.0.0.1 --username=caselens_owner --dbname=caselens --set=ON_ERROR_STOP=1 --file="$migration"
          done
          # The projection's schema versions independently of the pipeline's, on its own server.
          for migration in apps/analytics/migrations/0*.sql; do
            PGPASSWORD=ci_analytics_password psql --host=127.0.0.1 --port=5433 --username=caselens_analytics --dbname=caselens_analytics --set=ON_ERROR_STOP=1 --file="$migration"
          done
      - run: npm ci
      - run: npm run test:integration:database

  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install reportlab pypdf pdfplumber Pillow
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python scripts/verify-fixtures.py

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker-compose.demo.yml config --quiet
      - run: docker compose --env-file infra/.env.prod-infra.example -f infra/docker-compose.prod-infra.yml config --quiet
      - run: docker compose --env-file infra/.env.production-local.example -f infra/docker-compose.production-local.yml config --quiet
