name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: caselens
          POSTGRES_USER: caselens_owner
          POSTGRES_PASSWORD: ci_owner_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U caselens_owner -d caselens"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      PGPASSWORD: ci_owner_password
      APP_DATABASE_PASSWORD: ci_runtime_password
      TEST_DATABASE_URL: postgresql://caselens_app:ci_runtime_password@127.0.0.1:5432/caselens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Initialize production database schema
        shell: bash
        run: |
          for script in infra/postgres/init/*.sql; do
            psql --host=127.0.0.1 --username=caselens_owner --dbname=caselens --set=ON_ERROR_STOP=1 --file="$script"
          done
          psql --host=127.0.0.1 --username=caselens_owner --dbname=caselens --set=ON_ERROR_STOP=1 --set=runtime_password="$APP_DATABASE_PASSWORD" --file=infra/postgres/provision/001_runtime_login.sql
      - run: npm ci
      - run: npm run test:integration:database

  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install reportlab pypdf pdfplumber Pillow
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python scripts/verify-fixtures.py

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker-compose.demo.yml config --quiet
      - run: docker compose --env-file infra/.env.prod-infra.example -f infra/docker-compose.prod-infra.yml config --quiet
      - run: docker compose --env-file infra/.env.production-local.example -f infra/docker-compose.production-local.yml config --quiet
