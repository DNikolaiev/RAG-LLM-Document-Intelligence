name: caselens-production-local

x-app-environment: &app-environment
  APP_MODE: production
  AUTH_MODE: test-profiles
  ENABLE_TEST_IDENTITY_SWITCHER: 'true'
  FIXTURE_POLICY_CATALOG_ENABLED: 'true'
  PUBLIC_API_URL: http://localhost:4100
  DATABASE_URL: postgresql://caselens_app:${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}@postgres:5432/caselens
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_REGION: eu-central-1
  S3_BUCKET: caselens
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
  PERSISTENCE_PROVIDER: postgres
  STORAGE_PROVIDER: s3
  SEARCH_PROVIDER: postgres
  QUEUE_PROVIDER: bullmq
  QUEUE_NAME: caselens-processing
  # Commands travel on Redis/BullMQ above; facts travel here. Two channels on purpose - a work
  # queue delivers to exactly one consumer, which is the wrong shape for a fact that any number
  # of services may care about.
  RABBITMQ_URL: amqp://caselens:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}@rabbitmq:5672
  EVENT_RELAY_ENABLED: 'true'
  MODEL_PROVIDER: openai-compatible
  EMBEDDING_PROVIDER: openai-compatible
  MODEL_BASE_URL: http://ollama:11434/v1
  MODEL_API_KEY: ollama-local
  MODEL_NAME: ${OLLAMA_CHAT_MODEL:-qwen3:4b}
  MODEL_API_STYLE: ollama-native
  # Ollama 0.11 can crash while compiling the recursive rule-condition JSON grammar.
  # Prompted JSON plus strict Zod validation keeps the provider boundary safe and portable.
  MODEL_STRUCTURED_OUTPUT_MODE: json-object
  MODEL_INCLUDE_SCHEMA_IN_PROMPT: 'true'
  EMBEDDING_BASE_URL: http://ollama:11434/v1
  EMBEDDING_API_KEY: ollama-local
  EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-embeddinggemma:300m-qat-q4_0}
  EMBEDDING_DIMENSIONS: 768
  # Keep the CPU-local Ollama model saturated but never contended: one case,
  # one document/chunk request at a time. Raise only with dedicated capacity.
  WORKER_JOB_CONCURRENCY: '1'
  WORKER_MODEL_CONCURRENCY: '1'
  WORKER_MODEL_TIMEOUT_MS: '300000'
  OCR_PROVIDER: http
  OCR_BASE_URL: http://ocr:8000/v1/ocr
  SCANNER_PROVIDER: deterministic

x-durable-dependencies: &durable-dependencies
  postgres-migrate:
    condition: service_completed_successfully
  redis:
    condition: service_healthy
  minio-init:
    condition: service_completed_successfully
  rabbitmq:
    condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: caselens
      POSTGRES_USER: caselens_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - production-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U caselens_owner -d caselens']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  postgres-provision:
    image: pgvector/pgvector:pg17
    environment:
      PGHOST: postgres
      PGDATABASE: caselens
      PGUSER: caselens_owner
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}
    volumes:
      - ./postgres/provision:/provision:ro
    command:
      [
        'sh',
        '-c',
        'psql --set=runtime_password="$$APP_DATABASE_PASSWORD" --file=/provision/001_runtime_login.sql',
      ]
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  integration-tests:
    profiles: ['test']
    build:
      context: ..
      dockerfile: infra/docker/node.Dockerfile
    environment:
      TEST_DATABASE_URL: postgresql://caselens_app:${APP_DATABASE_PASSWORD:?Set APP_DATABASE_PASSWORD}@postgres:5432/caselens
      TEST_ADMIN_DATABASE_URL: postgresql://caselens_owner:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/caselens
    command: npm run test:integration:database
    depends_on:
      postgres-migrate: { condition: service_completed_successfully }
    restart: 'no'

  postgres-migrate:
    image: pgvector/pgvector:pg17
    environment:
      PGHOST: postgres
      PGDATABASE: caselens
      PGUSER: caselens_owner
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - ../packages/persistence/migrations:/migrations:ro
    command:
      [
        'sh',
        '-c',
        'psql -v ON_ERROR_STOP=1 -f /migrations/0001_job_lifecycle_events.sql -f /migrations/0002_policy_library.sql -f /migrations/0003_tenant_field_dictionary.sql -f /migrations/0004_field_embedding_index.sql -f /migrations/0005_domain_event_outbox.sql -f /migrations/0006_outbox_claiming.sql',
      ]
    depends_on:
      postgres-provision: { condition: service_completed_successfully }
    restart: 'no'

  redis:
    image: redis:8.2-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command:
      [
        'sh',
        '-c',
        'exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"',
      ]
    volumes: ['production-redis-data:/data']
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports:
      - '127.0.0.1:${MINIO_API_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes: ['production-minio-data:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" && mc mb --ignore-existing local/caselens',
      ]
    depends_on:
      minio: { condition: service_healthy }
    restart: 'no'

  ollama:
    image: ollama/ollama:0.11.10
    environment:
      OLLAMA_CONTEXT_LENGTH: '8192'
    volumes: ['production-ollama-data:/root/.ollama']
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  ollama-models:
    image: ollama/ollama:0.11.10
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:4b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-embeddinggemma:300m-qat-q4_0}
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'ollama pull "$$OLLAMA_CHAT_MODEL" && ollama pull "$$OLLAMA_EMBEDDING_MODEL"',
      ]
    depends_on:
      ollama: { condition: service_healthy }
    restart: 'no'

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: caselens
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    ports:
      # Management UI only. The AMQP port stays inside the compose network - the exchange and its
      # bindings are visible at http://localhost:15672 , which is most of why this image was chosen
      # over the plain one: the routing topology is worth being able to see.
      - '127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    volumes: ['production-rabbitmq-data:/var/lib/rabbitmq']
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # A separate server, not another database on the one above. Analytics owning its data is the
  # point of the exercise, and sharing an instance would leave the boundary as a convention that
  # one convenient query could cross. Here it cannot reach the transactional tables at all.
  analytics-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: caselens_analytics
      POSTGRES_USER: caselens_analytics
      POSTGRES_PASSWORD: ${ANALYTICS_DATABASE_PASSWORD:?Set ANALYTICS_DATABASE_PASSWORD}
    volumes: ['production-analytics-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U caselens_analytics -d caselens_analytics']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  ocr:
    build:
      context: ..
      dockerfile: services/ocr/Dockerfile
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infra/docker/node.Dockerfile
      args: { PACKAGE: '@caselens/api' }
    environment:
      <<: *app-environment
      API_PORT: 4100
    ports: ['127.0.0.1:4100:4100']
    depends_on: *durable-dependencies
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4100/v1/health/ready']
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: infra/docker/node.Dockerfile
      args: { PACKAGE: '@caselens/worker' }
    environment:
      <<: *app-environment
    depends_on:
      <<: *durable-dependencies
      api: { condition: service_healthy }
      ollama-models: { condition: service_completed_successfully }
      ocr: { condition: service_healthy }
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/docker/node.Dockerfile
      args:
        PACKAGE: '@caselens/web'
        APP_MODE: production
        AUTH_MODE: test-profiles
        ENABLE_TEST_IDENTITY_SWITCHER: 'true'
        PUBLIC_API_URL: http://api:4100
    environment:
      APP_MODE: production
      AUTH_MODE: test-profiles
      ENABLE_TEST_IDENTITY_SWITCHER: 'true'
      PUBLIC_API_URL: http://api:4100
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  production-postgres-data:
  production-rabbitmq-data:
  production-analytics-data:
  production-redis-data:
  production-minio-data:
  production-ollama-data:
