name: caselens

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: caselens
      POSTGRES_USER: caselens_owner
      POSTGRES_PASSWORD: caselens-owner-local-only
    ports: ['5432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U caselens_owner -d caselens']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['6379:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: caselens
      MINIO_ROOT_PASSWORD: caselens-minio-local-only
    ports: ['9000:9000', '9001:9001']
    volumes: ['minio-data:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    profiles: ['demo']
    build:
      context: ..
      dockerfile: infra/docker/node.Dockerfile
      args: { PACKAGE: '@caselens/api' }
    environment:
      APP_MODE: demo
      API_PORT: 4100
      PUBLIC_API_URL: http://localhost:4100
      PERSISTENCE_PROVIDER: memory
      QUEUE_PROVIDER: memory
      STORAGE_PROVIDER: memory
      MODEL_PROVIDER: deterministic
      OCR_PROVIDER: deterministic
      SEARCH_PROVIDER: memory
    ports: ['4100:4100']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4100/v1/health/ready']
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    profiles: ['demo']
    build:
      context: ..
      dockerfile: infra/docker/node.Dockerfile
      args: { PACKAGE: '@caselens/worker' }
    environment:
      APP_MODE: demo
      PERSISTENCE_PROVIDER: memory
      QUEUE_PROVIDER: memory
      STORAGE_PROVIDER: memory
      SEARCH_PROVIDER: memory
      MODEL_PROVIDER: deterministic
      OCR_PROVIDER: deterministic
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  web:
    profiles: ['demo']
    build:
      context: ..
      dockerfile: infra/docker/node.Dockerfile
      args: { PACKAGE: '@caselens/web' }
    environment:
      APP_MODE: demo
      PUBLIC_API_URL: http://api:4100
    ports: ['3000:3000']
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
